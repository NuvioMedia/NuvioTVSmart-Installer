name: NuvioTVInstaller
options:
  bundleIdPrefix: space.nuvio
  deploymentTarget:
    iOS: "17.0"
packages:
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: "0.12.1"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation.git
    exactVersion: "0.9.20"
targets:
  NuvioTVInstaller:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: web
        type: folder
        buildPhase: resources
    dependencies:
      - package: Citadel
      - package: ZIPFoundation
    settings:
      base:
        PRODUCT_NAME: "Nuvio TV Installer"
        PRODUCT_BUNDLE_IDENTIFIER: space.nuvio.webtvinstaller
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1.0.0"
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Nuvio TV Installer"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIStatusBarStyle: UIStatusBarStyleLightContent
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Nuvio TV Installer connects to your TV on the local network to install and manage Nuvio."
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
    info:
      path: Sources/Info.plist
      properties:
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
          NSAllowsLocalNetworking: true
        UILaunchScreen: {}
